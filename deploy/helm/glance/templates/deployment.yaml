apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "glance.fullname" . }}
  labels:
    {{- include "glance.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  # ⭐ This controls how many old ReplicaSets are kept
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit | default 2 }}

  selector:
    matchLabels:
      {{- include "glance.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}

      labels:
        {{- include "glance.selectorLabels" . | nindent 8 }}

    spec:
      containers:
        - name: {{ include "glance.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}

          volumeMounts:
            - name: config
              mountPath: /app/config/glance.yml
              subPath: glance.yml

      volumes:
        - name: config
          configMap:
            name: {{ include "glance.fullname" . }}
