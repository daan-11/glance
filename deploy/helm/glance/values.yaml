replicaCount: 1

image:
  repository: glanceapp/glance
  tag: latest
  pullPolicy: IfNotPresent

containerPort: 8080
revisionHistoryLimit: 2
service:
  type: ClusterIP
  port: 80
  targetPort: 8080

config: |
  pages:
    - name: Home
      columns:

        - size: small
          widgets:
            - type: clock
            - type: calendar

        - size: full
          widgets:

            # Status checks are HTTP GETs. UDP game ports use that same
            # monitor mechanism; they are not given a public link.
            - type: split-column
              max-columns: 3
              widgets:

                - type: monitor
                  title: Infra
                  cache: 1m
                  sites:
                    - title: Gitea
                      url: http://10.43.239.83
                      icon: si:gitea

                    - title: Grafana
                      url: http://10.43.149.150
                      icon: si:grafana

                    - title: Argo
                      url: http://10.43.17.234
                      icon: si:argo

                    - title: KubeCare
                      url: http://10.43.240.63:8080
                      icon: si:kubernetes

                - type: monitor
                  title: Hosting
                  cache: 1m
                  sites:
                    - title: Zomboid server
                      url: http://10.43.246.139:16261
                      icon: mdi:controller

                    - title: Zomboid server 16262
                      url: http://10.43.246.139:16262
                      icon: mdi:controller

                    - title: Zomboid panel
                      url: http://10.43.11.113:3001
                      icon: mdi:monitor-dashboard

                - type: monitor
                  title: Applications
                  cache: 1m
                  sites:
                    - title: ChronoFlow
                      url: http://10.43.182.225:80
                      icon: si:clockify

                    - title: Cyberline
                      url: http://10.43.243.101
                      icon: si:cypress

                    - title: Automagisch
                      url: http://10.43.18.5
                      icon: mdi:auto-fix

                    - title: Brief
                      url: http://10.43.175.156:80
                      icon: mdi:text-box-outline

            - type: bookmarks
              title: Services
              columns: 3
              groups:
                - title: Infra
                  color: 36 90 51
                  links:
                    - title: Gitea
                      url: https://gitea.vulture-qilin.ts.net
                      icon: si:gitea

                    - title: Grafana
                      url: https://grafana.vulture-qilin.ts.net
                      icon: si:grafana

                    - title: Argo
                      url: https://argo.vulture-qilin.ts.net
                      icon: si:argo

                    - title: KubeCare
                      url: https://kubecare.vulture-qilin.ts.net
                      icon: si:kubernetes

                - title: Hosting
                  color: 168 55 42
                  links:
                    - title: Zomboid panel
                      url: https://pz-panel.vulture-qilin.ts.net
                      icon: mdi:monitor-dashboard

                - title: Applications
                  color: 243 79 61
                  links:
                    - title: ChronoFlow
                      url: https://chronoflow.vulture-qilin.ts.net
                      icon: si:clockify

                    - title: Cyberline
                      url: https://cyberline.nl
                      icon: si:cypress

                    - title: Automagisch
                      url: https://automagisch.vulture-qilin.ts.net
                      icon: mdi:auto-fix

                    - title: Brief
                      url: https://brief.vulture-qilin.ts.net
                      icon: mdi:text-box-outline

            # ⭐ Hacker News Widget (Full Size)
            - type: hacker-news
              title: Hacker News
              limit: 15
              collapse-after: 3
