replicaCount: 1

image:
  repository: glanceapp/glance
  tag: latest
  pullPolicy: IfNotPresent

containerPort: 8080
revisionHistoryLimit: 2
service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Cursor Admin API key (Basic auth username, empty password). Never put the
# key in this file. Create the Secret, then set the name below and redeploy:
#   kubectl -n <namespace> create secret generic glance-cursor-admin \
#     --from-literal=api-key='<team admin API key>'
# Leave adminApiKeySecretName empty until that Secret exists. Glance still
# starts; the spending widget shows an error instead of invented percentages.
cursor:
  adminApiKeySecretName: ""
  adminApiKeySecretKey: api-key

config: |
  pages:
    - name: Home
      columns:

        - size: small
          widgets:
            - type: clock
            - type: calendar

            # Team spend from the Cursor Admin API (Basic auth).
            # POST https://api.cursor.com/teams/spend
            # The Admin API does not expose Cursor Models / Other Models /
            # Grok Bot pool percents or their reset times.
            - type: custom-api
              title: Cursor
              cache: 1h
              url: https://api.cursor.com/teams/spend
              method: POST
              body-type: json
              body:
                page: 1
                pageSize: 100
              basic-auth:
                username: "${CURSOR_ADMIN_API_KEY}"
                password: ""
              headers:
                Accept: application/json
              template: |
                {{ if ne .Response.StatusCode 200 }}
                <p class="color-negative size-h5">Spend did not load (HTTP {{ .Response.StatusCode }}). Set CURSOR_ADMIN_API_KEY.</p>
                {{ else if not (.JSON.Exists "teamMemberSpend") }}
                <p class="color-negative size-h5">Admin API response has no team spend.</p>
                {{ else }}
                {{ $onDemand := 0.0 }}
                {{ $overall := 0.0 }}
                {{ $limit := 0.0 }}
                {{ range .JSON.Array "teamMemberSpend" }}
                  {{ $onDemand = add $onDemand (.Float "spendCents") }}
                  {{ $overall = add $overall (.Float "overallSpendCents") }}
                  {{ if gt (.Float "effectivePerUserLimitDollars") 0.0 }}
                    {{ $limit = add $limit (.Float "effectivePerUserLimitDollars") }}
                  {{ end }}
                {{ end }}
                {{ $included := sub $overall $onDemand }}
                <div class="flex justify-between gap-10">
                  <span>Included</span>
                  <span class="color-highlight">{{ printf "$%.2f" (div $included 100) }}</span>
                </div>
                <div class="flex justify-between gap-10 margin-top-5">
                  <span>On-demand</span>
                  <span class="color-highlight">{{ printf "$%.2f" (div $onDemand 100) }}</span>
                </div>
                {{ if gt $limit 0.0 }}
                <div class="size-h6 color-subdue">{{ printf "%.0f" (mul (div (div $onDemand 100) $limit) 100) }}% of limit</div>
                {{ end }}
                {{ $startRaw := .JSON.String "subscriptionCycleStart" }}
                {{ if findMatch "^[0-9]{13,}$" $startRaw }}
                  {{ $start := printf "%d" (div (.JSON.Int "subscriptionCycleStart") 1000) | parseTime "unix" }}
                  <div class="size-h6 color-subdue margin-top-10">Cycle started {{ $start | formatTime "Jan 2" }}</div>
                {{ end }}
                {{ if gt (.JSON.Int "totalPages") 1 }}
                <div class="size-h6 color-subdue">Page 1 of {{ .JSON.Int "totalPages" }}</div>
                {{ end }}
                <p class="size-h6 color-subdue margin-top-10">Pool % and Grok Bot usage are not in the Admin API.</p>
                {{ end }}

        - size: full
          widgets:

            # Status checks are HTTP GETs. The game ports are UDP, so they are
            # not probed — an HTTP GET only times out.
            - type: split-column
              max-columns: 3
              widgets:

                - type: monitor
                  title: Infra
                  cache: 1m
                  sites:
                    - title: Gitea
                      url: http://10.43.239.83
                      icon: si:gitea

                    - title: Grafana
                      url: http://10.43.149.150
                      icon: si:grafana

                    - title: Argo
                      url: http://10.43.17.234
                      icon: si:argo

                    - title: KubeCare
                      url: http://10.43.240.63:8080
                      icon: si:kubernetes

                - type: monitor
                  title: Hosting
                  cache: 1m
                  sites:
                    - title: Zomboid panel
                      url: http://10.43.11.113:3001
                      icon: mdi:monitor-dashboard

                - type: monitor
                  title: Applications
                  cache: 1m
                  sites:
                    - title: ChronoFlow
                      url: http://10.43.182.225:80
                      icon: si:clockify

                    - title: Cyberline
                      url: http://10.43.243.101
                      icon: si:cypress

                    - title: Automagisch
                      url: http://10.43.18.5
                      icon: mdi:auto-fix

                    - title: Brief
                      url: http://10.43.175.156:80
                      icon: mdi:text-box-outline

            - type: html
              source: |
                <div class="widget">
                  <div class="widget-header">
                    <h2 class="uppercase">Zomboid server</h2>
                  </div>
                  <div class="widget-content">
                    <div class="flex items-center gap-15">
                      <img class="monitor-site-icon flat-icon" src="https://cdn.jsdelivr.net/npm/@mdi/svg@latest/svg/controller.svg" alt="">
                      <ul class="list-horizontal-text">
                        <li>10.43.246.139</li>
                        <li>16261/UDP</li>
                        <li>16262/UDP</li>
                      </ul>
                    </div>
                  </div>
                </div>

            - type: bookmarks
              title: Services
              columns: 3
              groups:
                - title: Infra
                  color: 36 90 51
                  links:
                    - title: Gitea
                      url: https://gitea.vulture-qilin.ts.net
                      icon: si:gitea

                    - title: Grafana
                      url: https://grafana.vulture-qilin.ts.net
                      icon: si:grafana

                    - title: Argo
                      url: https://argo.vulture-qilin.ts.net
                      icon: si:argo

                    - title: KubeCare
                      url: https://kubecare.vulture-qilin.ts.net
                      icon: si:kubernetes

                - title: Hosting
                  color: 168 55 42
                  links:
                    - title: Zomboid panel
                      url: https://pz-panel.vulture-qilin.ts.net
                      icon: mdi:monitor-dashboard

                - title: Applications
                  color: 243 79 61
                  links:
                    - title: ChronoFlow
                      url: https://chronoflow.vulture-qilin.ts.net
                      icon: si:clockify

                    - title: Cyberline
                      url: https://cyberline.nl
                      icon: si:cypress

                    - title: Automagisch
                      url: https://automagisch.vulture-qilin.ts.net
                      icon: mdi:auto-fix

                    - title: Brief
                      url: https://brief.vulture-qilin.ts.net
                      icon: mdi:text-box-outline

            # ⭐ Hacker News Widget (Full Size)
            - type: hacker-news
              title: Hacker News
              limit: 15
              collapse-after: 3
